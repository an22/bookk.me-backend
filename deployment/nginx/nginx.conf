worker_processes auto;
events {
}
http {
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  resolver 127.0.0.11 valid=30s;

  server {
    listen 443 ssl;
    server_name         orchestrator.bookkk.me;
    ssl_certificate     /etc/letsencrypt/live/orchestrator.bookkk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orchestrator.bookkk.me/privkey.pem;

    location / {
        set $upstream orchestrator.bookk.me;
        proxy_pass https://$upstream:9443;
    }
  }

  server {
    listen 443 ssl;
    server_name         kafka.bookkk.me;
    ssl_certificate     /etc/letsencrypt/live/kafka.bookkk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafka.bookkk.me/privkey.pem;
    allow 10.8.0.0/24;
    deny all;

    location / {
        set $upstream ui.kafka.bookk.me;
        proxy_pass http://$upstream:8080;
    }
  }

  server {
    listen 443 ssl;
    server_name         kibana.bookkk.me;
    ssl_certificate     /etc/letsencrypt/live/kibana.bookkk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kibana.bookkk.me/privkey.pem;
    allow 10.8.0.0/24;
    deny all;
    location / {
        set $upstream kibana.elastic.bookk.me;
        proxy_pass http://$upstream:5601;
    }
  }

  server {
    listen 443 ssl;
    server_name         vpn.bookkk.me;
    ssl_certificate     /etc/letsencrypt/live/vpn.bookkk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.bookkk.me/privkey.pem;

    location / {
        set $upstream vpn.bookk.me;
        proxy_pass http://$upstream:51821;
    }
  }

  server {
    listen 443 ssl;
    server_name         www.bookkk.me;
    ssl_certificate     /etc/letsencrypt/live/bookkk.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookkk.me/privkey.pem;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
       proxy_pass https://127.0.0.1:8080;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass https://127.0.0.1:443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
  }
}