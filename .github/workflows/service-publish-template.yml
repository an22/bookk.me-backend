name: Service publish template
on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:

  dockerPushService:
    name: Publish Ktor Service
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore cache
        id: gradle-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./**/.gradle
            ./**/build
          key: ${{ runner.os }}-gradle-build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish image
        run: ./gradlew ${{ inputs.module }}:publishImage

      - name: Save cache
        id: gradle-cache-save
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./**/.gradle
            ./**/build
          key: ${{ runner.os }}-gradle-build
