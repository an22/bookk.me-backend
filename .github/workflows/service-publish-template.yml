name: Service publish template
permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

on:
  workflow_call:
    secrets:
      envFile:
        required: true
    inputs:
      module:
        required: true
        type: string
      registry:
        required: true
        type: string
      serviceName:
        required: true
        type: string
      tagPrefix:
        required: true
        type: string

jobs:

  dockerPushService:
    name: Publish Ktor Service
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import environment variables from a file
        shell: bash
        run: echo ${{ secrets.envFile }} >> $GITHUB_ENV

      - name: Prepare docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write release version
        id: version
        run: echo "version_tag=${${{ steps.meta.outputs.tags }}#*/}" >> "$GITHUB_OUTPUT"

      - name: Publish image
        id: push
        shell: bash
        run: |
          ./gradlew ${{ inputs.module }}:publishImage
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ inputs.registry }}/${{ inputs.serviceName }}:${{ steps.version.outputs.version_tag }}  | perl -wnE'say /sha256.*/g')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          BOOKK_ME_SERVICE_VERSION: ${{ steps.version.outputs.version_tag }}
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ inputs.registry }}/${{ inputs.serviceName }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
