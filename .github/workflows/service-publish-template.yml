name: Service publish template
permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

on:
  workflow_call:
    secrets:
      gradleEncryption:
        required: true
    inputs:
      module:
        required: true
        type: string
      serviceName:
        required: true
        type: string
    outputs:
      version:
        value: ${{jobs.dockerPushService.outputs.version}}
jobs:

  dockerPushService:
    name: Publish service
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21.0.6'
          distribution: 'corretto'

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          cache-encryption-key: ${{ secrets.gradleEncryption }}
          cache-overwrite-existing: true

      - name: Publish image
        id: push
        shell: bash
        run: |
          ./gradlew ${{ inputs.module }}:publishImage
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release version
        id: version
        shell: bash
        run: |
          image_tag="${{ steps.meta.outputs.tags }}"
          echo "version_tag=${image_tag#*-}" >> $GITHUB_OUTPUT
