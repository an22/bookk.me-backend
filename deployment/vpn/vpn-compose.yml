networks:
  bookk-me:
    external: true

volumes:
  etc_wireguard:
    driver: local

configs:
  dns-config:
    name: dns-config-v8
    file: dns-config.conf

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.tcp_congestion_control=bbr
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    networks:
      bookk-me:
        aliases:
          - vpn.bookk.me
    environment:
      LANG: en
      WG_HOST: vpn.bookkk.me
      PASSWORD_HASH: ${VPN_PASSWORD_HASH}
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: 1
      UI_ENABLE_SORT_CLIENTS: "true"
      WG_ALLOWED_IPS: 10.8.0.0/24
      WG_MTU: 1280
      WG_PERSISTENT_KEEPALIVE: 25
      WG_DEFAULT_DNS: 10.8.0.2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]

  dns:
    image: strm/dnsmasq:latest
    configs:
      - source: dns-config
        target: /etc/dnsmasq.conf
    ports:
      - "53:53/udp"
    networks:
      bookk-me:
        aliases:
          - dns.bookk.me
    cap_add:
      - NET_ADMIN
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]