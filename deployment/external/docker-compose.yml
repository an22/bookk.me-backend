services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.tcp_congestion_control=bbr
    ports:
      - "51822:51820/udp"
      - "51823:51821/tcp"
    environment:
      LANG: en
      WG_HOST: bookkme.app
      PASSWORD_HASH: $$2a$$12$$NoX52sEhs8pUEYufm4hvue/y6yD.8MkAp7uq.twl.QT7wOde5Urfe
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: 1
      UI_ENABLE_SORT_CLIENTS: "true"
      WG_ALLOWED_IPS: 10.8.0.0/24
      WG_MTU: 1280
      WG_PERSISTENT_KEEPALIVE: 25
      WG_DEFAULT_DNS: 8.8.8.8
    logging:
      options:
        max-size: 20m
        max-file: 5