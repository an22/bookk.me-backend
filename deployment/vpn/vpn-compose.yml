networks:
  operational:
    external: true

volumes:
  etc_wireguard:
    driver: local

configs:
  dns-entrypoint:
    name: dns-entrypoint-v5
    file: dns/entrypoint.sh
  dns-config:
    name: dns-config-v3
    file: dns/dnsmasq.conf.template

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.tcp_congestion_control=bbr
    volumes:
      - etc_wireguard:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    networks:
      operational:
        aliases:
          - vpn
    environment:
      LANG: en
      WG_HOST: vpn.${DOMAIN_NAME}
      PASSWORD_HASH: ${VPN_PASSWORD_HASH}
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: 1
      UI_ENABLE_SORT_CLIENTS: "true"
      WG_ALLOWED_IPS: 10.8.0.0/24
      WG_MTU: 1280
      WG_PERSISTENT_KEEPALIVE: 25
      WG_DEFAULT_DNS: 10.8.0.2
    logging:
      options:
        max-size: 20m
        max-file: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]

  dns:
    image: strm/dnsmasq:latest
    entrypoint: ["./entrypoint.sh"]
    configs:
      - source: dns-config
        target: /etc/dnsmasq.conf.template
      - source: dns-entrypoint
        target: /entrypoint.sh
        mode: 0744
    ports:
      - "53:53/udp"
    networks:
      operational:
        aliases:
          - dns
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    cap_add:
      - NET_ADMIN
    logging:
      options:
        max-size: 10m
        max-file: 3
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]