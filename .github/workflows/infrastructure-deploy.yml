name: Deploy project infrastructure
on: workflow_dispatch

jobs:

  deploy:
    name: Deploy environment stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create remote context
        run: |
          docker context create swarm-manager --docker "host=${{ secrets.SWARM_MANAGER_URL }}"
          docker context use swarm-manager

      - name: Deploy VPN server
        working-directory: ./deployment/vpn
        run: |
          docker stack deploy -c vpn-compose.yml vpn

      - name: Deploy container orchestrator
        working-directory: ./deployment/orchestrator
        run: |
          docker stack deploy -c orchestrator-compose.yml orchestrator

      - name: Deploy Kafka cluster
        working-directory: ./deployment/kafka
        run: |
          docker stack deploy -c kafka-compose.yml kafka

      - name: Deploy Elastic cluster
        working-directory: ./deployment/elastic-stack
        run: |
          docker stack deploy -c elastic-compose.yml elastic

      - name: Deploy Nginx reverse proxy
        working-directory: ./.github/workflows/deployment/nginx
        run: |
          docker stack deploy -c nginx-compose.yml nginx