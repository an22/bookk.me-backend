version: "3.9"

services:
  nginx:
    image: nginx:latest
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - './service/nginx.conf:/etc/nginx/nginx.conf'
      - './security/nginx-selfsigned.crt:/etc/service/nginx-selfsigned.crt:ro'
      - './security/nginx-selfsigned.key:/etc/service/nginx-selfsigned.key:ro'
  auth:
    image: com.bookk.server.microservice.authorization
    hostname: auth.service.bookk.me
    env_file:
      - service/auth.env
    volumes:
      - './security/test.jks:/etc/service/keystore.jks:ro'
      - './security/private.pem:/etc/service/private.pem:ro'
      - './security/public.pem:/etc/service/public.pem:ro'

  user:
    image: com.bookk.server.microservice.user
    hostname: user.service.bookk.me
    env_file:
      - service/user.env
    volumes:
      - './security/test.jks:/etc/service/keystore.jks:ro'
      - './security/private.pem:/etc/service/private.pem:ro'
      - './security/public.pem:/etc/service/public.pem:ro'