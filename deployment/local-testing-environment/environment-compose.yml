version: "3.9"

volumes:
  kafka_volume:
    driver: local
  redis_data:
    driver: local
  database_data:
    driver: local
  reference_database_data:
    driver: local

services:
  nginx:
    image: nginx:1.29.4
    hostname: nginx.local
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
  kafka:
    image: bitnami/kafka:3.8.0
    hostname: kafka_local
    volumes:
      - kafka_volume:/bitnami/kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft
      KAFKA_BROKER_ID: 1
      KAFKA_KRAFT_CLUSTER_ID: "R6YjCd49YUUaN6hC4tFH4Ljy"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      # Listeners
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Config
      KAFKA_CFG_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CLUSTERS_0_NAME: "R6YjCd49YUUaN6hC4tFH4Ljy"

  redis:
    image: bitnami/redis:6.2.14
    hostname: redis_local
    volumes:
      - redis_data:/opt/bitnami/redis/
    ports:
      - '127.0.0.1:6379:6379'

    environment:
      REDIS_DISABLE_COMMANDS: FLUSHDB,FLUSHALL,CONFIG
      REDIS_PASSWORD: "R6YjCd49YUUaN6hC4tFH4Ljy"

  redis-ui:
    image: redis/redisinsight:2.58
    depends_on:
      - redis
    ports:
      - '5540:5540'

  database:
    image: mariadb:11.8.3-ubi9
    hostname: mariadb_local
    ports:
      - '127.0.0.1:3307:3307'
    environment:
      MARIADB_ROOT_PASSWORD: "4FB3P4y3mbRKAxASQjM6cBA52qKMFDqW"
      MARIADB_USER: "user"
      MARIADB_PASSWORD: "4FB3P4y3mbRKAxASQjM6cBA52qKMFDqW"
      MYSQL_TCP_PORT: 3307
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD
      timeout: 10s
      retries: 10

  migration-database:
    image: mariadb:11.8.3-ubi9
    hostname: mariadb_local_migration
    ports:
      - '127.0.0.1:3308:3308'
    environment:
      MARIADB_ROOT_PASSWORD: "migration"
      MARIADB_USER: "migration"
      MARIADB_PASSWORD: "migration"
      MYSQL_TCP_PORT: 3308
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD
      timeout: 10s
      retries: 10