name: Add new server node
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Host'
        required: true
      port:
        description: 'Port'
        required: true
        default: '22'
      username:
        description: 'Username'
        required: true
      password:
        description: 'Password'
        required: true
      token:
        description: 'Token'
        required: true
      advertise_addr:
        description: 'Node IP'
        required: true


jobs:

  add_manaer:
    name: Add new manager node
    runs-on: self-hosted
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Add node to swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ github.event.inputs.host }}
          username: ${{ github.event.inputs.username }}
          password: ${{ github.event.inputs.password }}
          port: ${{ github.event.inputs.port }}
          script: |
            docker swarm join --token ${{ github.event.inputs.token }} --advertise-addr "${{ github.event.inputs.advertise_addr }}" "${{ secrets.VPN_SUBNET }}"