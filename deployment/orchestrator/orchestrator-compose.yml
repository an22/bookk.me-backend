version: '3.2'

secrets:
  dozzle-auth:
    external: true

services:
  dozzle:
    image: amir20/dozzle:latest
    secrets:
      - source: dozzle-auth
        target: /data/users.yml
    environment:
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_SHELL: "true"
      DOZZLE_MODE: "swarm"
      DOZZLE_AUTH_PROVIDER: "simple"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      agent_network:
        aliases:
          - dozzle.bookk.me
    deploy:
      mode: global

  agent:
    image: portainer/agent:2.22.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]
    logging:
      options:
        max-size: 20m
        max-file: 5

  portainer:
    image: portainer/portainer-ce:2.22.0
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      agent_network:
      bookk-me:
        aliases:
          - orchestrator.bookk.me
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
    logging:
      options:
        max-size: 20m
        max-file: 5

networks:
  agent_network:
    external: true
  bookk-me:
    external: true

volumes:
  portainer_data: